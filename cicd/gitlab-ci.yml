# 为此 bundle 的 GitLab CI/CD。复制到 GitLab 项目根目录作为 .gitlab-ci.yml。
# GitLab CI/CD for this bundle. Copy to the root of a GitLab project as .gitlab-ci.yml.
#
# 合并请求运行 `bundle validate`。到默认分支的合并会以服务主体 (OAuth M2M) 的身份部署 `cicd` 目标，
# 因此在生产环境中没有人需要直接的部署权限。
# Merge requests run `bundle validate`. Merges to the default branch deploy the `cicd` target as a service
# principal (OAuth M2M), so nobody needs direct deploy rights in production.
#
# 设置 → CI/CD → 变量（隐藏；受保护，以便仅受保护的分支可以部署）:
# Settings → CI/CD → Variables (Masked; Protected so only protected branches can deploy):
#   DATABRICKS_CLIENT_ID       service principal application ID / 服务主体应用 ID
#   DATABRICKS_CLIENT_SECRET   service principal OAuth secret / 服务主体 OAuth 密钥
# 工作区 URL 来自 databricks.yml 中的 `workspace.host`。可选的 bundle 变量，例如
# The workspace URL comes from `workspace.host` in databricks.yml. Optional bundle variables, e.g.
#   BUNDLE_VAR_catalog=hytech_ws_catalog   BUNDLE_VAR_llm_endpoint=databricks-claude-sonnet-4-5
#
# Runner 从 github.com 下载 CLI。如果你的 Runner 无法访问 GitHub，请将 CLI 构建到
# Runner 镜像中或在内部镜像发布 zip。
# The runner downloads the CLI from github.com. If your runners cannot reach GitHub, bake the CLI into the
# runner image or mirror the release zip internally.

variables:
  DATABRICKS_CLI_VERSION: "0.299.2"
  BUNDLE_TARGET: cicd
  BUNDLE_VAR_cicd_service_principal: $DATABRICKS_CLIENT_ID

stages: [validate, deploy]

default:
  image: debian:bookworm-slim
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends ca-certificates curl unzip > /dev/null
    - curl -fsSL "https://raw.githubusercontent.com/databricks/setup-cli/v${DATABRICKS_CLI_VERSION}/install.sh" | sh
    # `bundle validate` 然后打印部署身份 ("User: <application ID>")
    # `bundle validate` then prints the deploying identity ("User: <application ID>")
    - databricks --version

validate:
  stage: validate
  script:
    - databricks bundle validate -t "$BUNDLE_TARGET"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

deploy:
  stage: deploy
  script:
    - databricks bundle validate -t "$BUNDLE_TARGET"
    - databricks bundle deploy -t "$BUNDLE_TARGET" --auto-approve
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  environment:
    name: production
  # 一次一个部署
  # one deployment at a time
  resource_group: databricks-production
